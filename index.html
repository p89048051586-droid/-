#app{max-width:720px;margin:0 auto;padding:1rem 1rem 2rem}
.hero{height:calc(min(100vw,100vh)*.74);min-height:240px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:1.4rem 1.3rem 1.6rem;box-shadow:0 10px 40px rgba(138,100,25,.14);backdrop-filter:blur(6px)}
h1,h2{font-family:"Marck Script",cursive;font-weight:400;color:var(--gold);margin:0;line-height:1.15}
h1{font-size:clamp(2rem,7vw,2.8rem)}h2{font-size:2rem}
.sub{color:var(--mut);margin:.3rem 0 1.2rem}
.lv{display:flex;flex-direction:column;gap:.15rem;width:100%;text-align:left;margin:.7rem 0 0;padding:1rem 1.2rem;font:inherit;color:var(--ink);background:var(--tile);border:2px solid var(--g2);border-radius:16px;cursor:pointer;transition:box-shadow .15s}
.lv:hover{box-shadow:0 0 0 4px rgba(201,161,63,.25)}.lv b{font-size:1.25rem;font-weight:600}.lv span{color:var(--mut);font-size:.95rem}
.back{font:500 .95rem inherit;font-family:inherit;color:var(--gold);background:none;border:0;padding:.3rem 0;margin-bottom:.8rem;cursor:pointer}
.grid{display:grid;gap:.7rem;margin-top:1rem}
.tile{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.9rem;text-align:left;padding:.85rem 1rem;font:inherit;color:var(--ink);background:var(--tile);border:1px solid var(--line);border-left:5px solid var(--g2);border-radius:14px;cursor:pointer}
.tile:hover:not(:disabled){border-color:var(--g2)}.tile:disabled{cursor:default;opacity:.55;border-left-color:var(--line)}
.tile .n{font:400 1.5rem "Marck Script",cursive;color:var(--gold);white-space:nowrap}.tile .t{font-weight:500;line-height:1.35}.tile .s{font-size:.88rem;color:var(--mut);text-align:right}.tile.done .s{color:var(--ok);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .3s}
.cnt{color:var(--mut);font-size:.9rem;margin:.5rem 0 0}.q{font-weight:500;margin:1.2rem 0 .2rem}
.word{font-weight:600;font-size:clamp(1.9rem,8vw,3rem);line-height:1.3;margin:.2rem 0 1.2rem;overflow-wrap:anywhere}
.gap{display:inline-block;min-width:1.1em;padding:0 .08em;text-align:center;color:var(--gold);border-bottom:3px solid var(--g2)}
.gap.w{min-width:2.5em}.gap.good{color:var(--ok);border-color:var(--ok)}.gap.bad{color:var(--no);border-color:var(--no);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@media(prefers-reduced-motion:reduce){.gap.bad{animation:none}.bar i{transition:none}}
.opts{display:flex;flex-wrap:wrap;gap:.7rem}
.opt{min-width:4.2rem;padding:.7rem 1.2rem;font:600 1.6rem inherit;font-family:inherit;color:var(--ink);background:var(--tile);border:2px solid var(--g2);border-radius:14px;cursor:pointer}
.opt.wide{font-size:1.2rem;flex:1 1 9rem}.opt:hover:not(:disabled){box-shadow:0 0 0 4px rgba(201,161,63,.25)}
.opt.good{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.opt.bad{background:var(--nobg);border-color:var(--no);color:var(--no)}.opt:disabled{cursor:default}
.fb{margin-top:1rem;border-radius:12px}.fb.ok,.fb.no{padding:.8rem 1rem}.fb.ok{background:var(--okbg);border-left:5px solid var(--ok)}.fb.no{background:var(--nobg);border-left:5px solid var(--no)}
.go{margin-top:.8rem;padding:.7rem 1.4rem;font:600 1rem inherit;font-family:inherit;color:#3B2A08;background:linear-gradient(135deg,var(--g1),var(--g2));border:0;border-radius:12px;cursor:pointer}
.ghost{margin:.8rem 0 0 .5rem;padding:.7rem 1.2rem;font:500 1rem inherit;font-family:inherit;color:var(--gold);background:none;border:2px solid var(--g2);border-radius:12px;cursor:pointer}
.res{text-align:center}.big{font:400 3.2rem "Marck Script",cursive;color:var(--gold);margin:.4rem 0 0}
.rl{margin-top:.6rem;padding-top:.6rem;border-top:1px dashed var(--g2)}.rl p{margin:.45rem 0}.rl>b{color:var(--gold);font-size:1.05rem}.rl i{font-style:normal;font-weight:600;color:var(--gold)}
.word.cm{font-size:clamp(1.3rem,5vw,1.8rem);font-weight:500;line-height:2}.sl{display:inline-block;width:1rem;height:1.5rem;padding:0;vertical-align:bottom;font:inherit;color:var(--gold);background:none;border:0;border-bottom:2px dotted var(--g2);cursor:pointer}.sl.good{color:var(--ok);border-bottom-color:var(--ok)}.sl.bad{color:var(--no);border-bottom-color:var(--no)}.sl.miss{color:var(--no);border:2px dashed var(--no);border-radius:4px}.sl:disabled{cursor:default}

<script>
const R={
r:["Корни -раст- / -ращ- / -рос-","Это один корень, у которого гласная чередуется. Смотрим, какие буквы стоят сразу после пропуска. Если дальше идёт сочетание ст или щ, пишется а. Если дальше любая другая буква (например, с или л), пишется о. Проверка: р_стение — после пропуска «ст», значит а; пор_сль — после пропуска «с» без «т», значит о.","растение, растить, возраст, выращенный — а; вырос, поросль, зарос — о.","росток (пишется о, хотя дальше идёт ст), отрасль (пишется а, хотя дальше идёт с); также Ростов, Ростислав."],
g:["Корни -гар- / -гор-","Гласная в этом корне зависит от ударения. Сначала поставьте ударение в слове. Если ударение падает на корень, пишется а. Если ударение падает на другой слог и корень безударный, пишется о. Проверка: зага́р — ударный корень, значит а; загоре́лый — ударение на «е», корень безударный, значит о.","гарь, угар, загар — а; гореть, загорелый, разгореться — о.","изгарь, выгарки, пригарь."],
z:["Корни -зар- / -зор-","Безударный корень всегда пишется с а. Если корень ударный, пишем ту гласную, которую слышим. Сначала найдите ударение. Проверка: заря́ и озаря́ть — ударение не на корне, значит а; зо́рька — ударный корень, слышим о, значит о.","заря, зарница, озарять — а; зарево, зорька — под ударением пишем как слышим.","Исключений нет."],
l:["Корни -лаг- / -лож-","Корень имеет два варианта. Если после него стоит буква г, пишется а: -лаг-. Если после него стоит ж, пишется о: -лож-. Проверка: предл_гать — дальше «г», значит а; предл_жение — дальше «ж», значит о.","предлагать, слагаемое, полагать — а; предложение, изложить, положение — о.","полог (это слово другого корня)."],
m:["Корни -мак- / -мок-","Здесь выбор зависит от смысла слова, а не от ударения. Если речь о погружении в жидкость, пишется а. Если речь о том, что предмет становится мокрым или пропускает воду, пишется о. Проверка: «макать сухарь в чай» — погрузить, значит а; «вымокнуть под дождём» — стать мокрым, значит о.","макать, обмакнуть — а; вымокнуть, промокашка, непромокаемый — о.","Исключений нет."],
sk:["Корни -скак- / -скоч-","Смотрим на букву после корня. Перед к пишется а, перед ч пишется о. Проверка: скакалка — после «ска» идёт «к», значит а; выскочить — идёт «ч», значит о.","скакать, скакалка — а; выскочить, вскочить — о.","скачок, скачу (здесь перед ч всё равно а)."],
rv:["Корни -равн- / -ровн-","Выбор зависит от значения. Если слово значит «равный, одинаковый», пишется а. Если «ровный, гладкий, прямой», пишется о. Проверка: сравнить — сделать равным, значит а; выровнять — сделать ровным, значит о.","равенство, равновесие, сравнить — а; ровный, выровнять, подровнять — о.","равнина (пишется а, хотя это ровное место); поровну, уровень, ровесник, ровня (пишется о)."],
tv:["Корни -твор- / -твар-","В корне -твор- пишется о, и именно он встречается почти во всех словах: творить, творец, творческий, затвор. Корень -твар- есть только в словах тварь и утварь.","творение, творец, затвор, творительный — о.","утварь, тварь — а."],
k:["Корни -кас- / -кос-","Смотрим на суффикс после корня. Если сразу после корня стоит суффикс -а-, пишется а. Если этого суффикса нет, пишется о. Проверка: прик_саться — после корня «а» (касаться), значит а; к_снуться — суффикс -а- нет (коснуться), значит о.","касаться, прикасаться, касательная — а; коснуться, прикосновение — о.","Исключений нет."],
pl:["Корни -плав- / -плов-","В корне почти всегда пишется а: плавать, плавучий, поплавок, плавание. О пишется только в нескольких словах, которые надо запомнить.","плавать, плавучий, поплавок, плавание — а.","пловец, пловчиха (и блюдо плов)."],
bl:["Корни -блест- / -блист-","Смотрим на суффикс -а- после корня. Если он есть, пишется и: -блист-. Если его нет, пишется е: -блест-. Проверка: блистательный и блистать — суффикс -а-, значит и; блестеть, блестящий, блеснуть — суффикса -а- нет, значит е.","блистать, блистательный — и; блестеть, блестящий, блеснуть — е.","Исключений нет."],
s:["Словарные слова","У этих слов нельзя подобрать проверочное слово, поэтому гласную нужно просто запомнить. Если сомневаетесь, проверьте слово по орфографическому словарю.","сапог, корзина, сирень, вокзал, картина, собака.","Правила нет, написание запоминается."],
d:["Двойные согласные в иноязычных словах","Единого правила нет. Двойная согласная пишется, если она была в слове, из которого мы это слово взяли. Поэтому такие слова нужно запоминать или проверять по орфографическому словарю. Ошибки обычно бывают двух видов: двойную пишут там, где она не нужна, или одинарную там, где нужна двойная.","с двойной: интеллектуальный, аттестат, диссертация, оккупация, коллегия, бюллетень, терраса, ассимиляция, ассоциация, аккуратный, компромисс (сс); с одинарной: прецедент, инцидент, компрометировать, палисадник, апеллировать (одна п).","Универсальных исключений нет, проверяйте каждое слово."],
j:["Разделительный ъ после приставки","Разделительный ъ пишется после приставки, которая оканчивается на согласную, перед буквами е, ё, ю, я. Мягкий знак в этом месте не пишется: ь бывает только внутри корня или суффикса (семья, ручьи, вьюга). Проверка: об_ект — приставка «об-» оканчивается на согласную, дальше «е», значит ъ.","объект, субъект, инъекция, адъютант, конъюнктура, объём, подъезд.","Исключений нет."],
bs:["Приставки без- / бес-","Приставки на з или с пишутся по звуку после них. Если дальше звонкая согласная или гласная, пишется з. Если дальше глухая согласная (п, ф, к, т, ш, с, х, ц, ч, щ), пишется с. Проверка: беспринципный — после приставки «п», он глухой, значит с; безапелляционный — после приставки гласная «а», значит з.","безупречный, безапелляционный, бездарный — з; бесшумный, беспринципный, бесцельный — с.","Исключений нет."],
p:["Приставки пре- / при-","Смотрим на значение приставки. Пре- значит «очень» (прекрасный) или «пере-» (преградить, преобразовать, превалировать, т. е. «перевешивать»). При- значит приближение, присоединение, неполное действие или близость (приехать, приклеить, приоткрыть, пришкольный). Слово приемлемый образовано от «принять», поэтому при-.","пре-: преемник, превалировать, преодолеть; при-: приемлемый, приехать.","Слова-термины запоминают: преамбула, претендент, прецедент, президент, претензия."]};
Object.assign(R,{
dj:["Двойная ж в словарных словах","В словах дрожжи, жжёт, жжёный, жужжать, жужжание, можжевельник пишется двойная ж. Проверочного слова у них нет, поэтому написание запоминают.","дрожжи, жжёт, жжёный, жужжать, можжевельник.","Правила нет, слова нужно запомнить."],
ii:["Искусный, искусственный, россиянин","Искусный (умелый) пишется с одной с: искус + суффикс -н-. Искусственный (не природный) пишется с двумя с: корень искус- плюс суффикс -ств-, отсюда сс на стыке (как в слове искусство). Россиянин пишется с двумя с, потому что корень — Росс- (Россия).","искусный мастер, искусственный интеллект, россиянин.","Исключений нет."],
rs:["Приставки раз- / рас-","Приставка пишется по звуку после неё. Перед звонкой согласной и гласной пишется з, перед глухой пишется с. Проверка: ра_жечь — после приставки звонкая «ж», значит з; ра_шифровать — глухая «ш», значит с. В слове рассчитать две с (приставка рас- плюс корень -счит-), а в слове расчёт одна с (приставка рас- плюс корень -чёт-).","разжечь, разбежаться — з; расшифровать, растаять — с; рассчитать — сс.","Исключений нет."],
c1:["Однородные члены предложения","Однородные члены отвечают на один вопрос и относятся к одному слову (что лежало? книги, тетради, ручки). Между ними ставится запятая. Перед одиночным союзом и запятая не нужна. Проверка: найдите ряд слов с одним вопросом, поставьте запятые между ними, а перед единственным и не ставьте.","книги, тетради, ручки и карандаши; в Москву, Петербург и Казань; в кино и в парк.","Если союз и повторяется (и хлеб, и сыр), запятая ставится перед каждым и, кроме первого."],
c2:["Обращение","Обращение — слово или группа слов, которыми называют того, к кому говорят (Андрей, друзья, уважаемые коллеги). Оно не является членом предложения и выделяется запятой. В середине предложения запятые ставятся с двух сторон.","Друзья, приходите к нам; Давайте, друзья, подумаем; Андрей, принеси карту.","Не путайте обращение с подлежащим: в предложении «Друзья пришли» обращения нет."],
c3:["Вводные слова","Вводные слова выражают отношение говорящего к сказанному (конечно, безусловно, к счастью, по-моему) или порядок мыслей (итак, во-первых, кстати). Они не отвечают на вопросы, и их можно убрать без потери смысла. Вводные слова выделяются запятыми.","Конечно, мы согласимся; К счастью, никто не заметил; Итак, мы начинаем; Во-первых, нужно подготовить документы.","Если слово связано с предложением и на него можно поставить вопрос, оно не вводное."],
c4:["Причастный и деепричастный обороты","Деепричастный оборот (Подготовив документы) выделяется запятой или запятыми в любом месте предложения. Причастный оборот (лежащая на полке) выделяется, если стоит после определяемого слова, и не выделяется, если стоит перед ним. Предлог несмотря на с существительным тоже выделяется. Проверка: найдите слово с -в, -вши, -я (деепричастие) или -щий, -нный (причастие), возьмите всё, что к нему относится, и обозначьте границы этой группы.","Подготовив документы, мы приступили; Книга, лежащая на полке, моя; Несмотря на условия, работа шла.","Одиночное деепричастие, близкое к наречию, не выделяется (Он шёл не спеша)."]});
Object.assign(R,{
on:["Суффиксы -онн- / -енн-","В прилагательных, образованных от существительных с суффиксами -онн- и -енн-, пишется нн: организация — организационный, революция — революционный, торжество — торжественный, родство — родственный. Проверка: найдите существительное на -ция или -ство, от которого образовано прилагательное.","организационный, революционные, традиционные, торжественное, родственные, хозяйственный.","Исключений нет."],
n1:["Н и НН в прилагательных на -ан- / -ян- / -ин-","В прилагательных, образованных от существительных суффиксами -ан-, -ян-, -ин-, пишется одна н: кожа — кожаный, шерсть — шерстяной, серебро — серебряный. Проверка: найдите существительное, от которого образовано слово. Ветреный (с ветром) и ветряной (мельница) пишутся с одной н, а безветренный (с приставкой без-) — с двумя.","кожаный, шерстяной, серебряный, масляные, ветряной, ветреный день.","Три слова с двумя н: деревянный, стеклянный, оловянный. Также безветренный."],
n2:["Одна или две н: отглагольные прилагательные и причастия","Если слово образовано от глагола и у него нет приставки (кроме не-), суффиксов -ова-/-ева- и зависимых слов, пишется одна н: жареный картофель, раненый боец. Если после слова стоят зависимые слова (на масле, в бою), это причастие и пишется нн: жаренный на масле, раненный в бою. Проверка: есть ли после слова пояснение, которое к нему относится.","жареный картофель, раненый боец; жаренный на масле, раненный в бою; варёное мясо.","Исключений нет."],
n3:["Нн в словах с приставкой, суффиксом -ова- и от глаголов совершенного вида","Две н пишутся, если у слова есть приставка (кроме не-), суффикс -ова-/-ева-/-ирова- или слово образовано от глагола совершенного вида: купить — купленный, решить — решённый, организовать — организованный, образовать — образованный. Проверка: поставьте вопрос «что сделать?», если глагол отвечает, пишется нн.","купленный, решённый, брошенный, организованное, образованный, воспитанный.","В кратких формах пишется одна н: организован, решён, воспитан."],
n4:["Н и НН в наречиях на -о / -е","В наречиях на -о, -е, образованных от прилагательных и причастий, пишется столько н, сколько в слове, от которого они образованы: сдержанный — сдержанно, организованный — организованно, удивлённый — удивлённо. Проверка: подберите прилагательное и посчитайте н.","сдержанно, организованно, взволнованно, удивлённо, воспитанно, квалифицированно.","Исключений нет."],
pr:["Производные предлоги и существительные с предлогом","Производные предлоги оканчиваются на -е и пишутся слитно: в течение (часа), в продолжение (недели), в заключение (доклада), вследствие (ошибки), ввиду (обстоятельств), наподобие, несмотря на. Если это существительное с предлогом, у него падежное окончание -и: в течении реки, в продолжении романа, в заключении эксперта. Проверка: слово можно заменить на «во время», «в конце», «из-за» — это предлог.","в течение часа, в продолжение недели, в заключение доклада, вследствие ошибки, ввиду обстоятельств, наподобие шара.","В течении реки, в продолжении романа — существительные."]});
Object.assign(R,{
c5:["Сложносочинённое предложение","Если предложение состоит из частей, равноправных по смыслу и связанных союзами и, а, но, однако, между частями перед союзом ставится запятая. Проверка: найдите подлежащие и сказуемые. Если у каждой части они свои, а соединяет их сочинительный союз, запятая нужна.","Солнце село, и стало темно; Мы пришли, но поезд ушёл; Брат читал, а сестра писала.","Если у частей одно общее подлежащее и союз и соединяет однородные сказуемые, запятая не нужна (Солнце село и скрылось)."],
c6:["Сложноподчинённое предложение","Придаточная часть присоединяется к главной союзом (что, чтобы, когда, если, хотя, потому что, как только) или союзным словом (который, где). Она всегда отделяется запятой. Если придаточная стоит в начале, запятая ставится после неё, если в середине — с двух сторон. Проверка: найдите союз и поставьте запятую на границе частей.","Когда закончился дождь, дети вышли; Я знал, что будет экзамен; Он сказал, что придёт, и положил трубку.","Между однородными придаточными, соединёнными одиночным и, запятая не ставится."],
c7:["Сложные случаи пунктуации","Придаточное со словом который выделяется запятыми и в середине предложения (Книга, которую я читал, интересна). Составные союзы (в связи с тем что, несмотря на то что) выделяют придаточную часть целиком, запятая ставится после неё. В двойных союзах не только … но и запятая стоит перед второй частью. В условных предложениях перед то запятая ставится, если придаточная часть стоит впереди (Если данные подтвердятся, то…).","Статья, которую опубликовали, вызвала дискуссию; Он не только подготовил доклад, но и ответил.","Союз и между однородными придаточными запятой не требует."],
h1:["Дефис в словах с вице-, экс-, штаб-, унтер-, лейб-, контр-","Слова с частями вице-, экс-, штаб-, унтер-, лейб-, обер- пишутся через дефис. Слово контр- в названиях званий (контр-адмирал) пишется через дефис, а в остальных словах слитно: контратака, контрудар.","вице-президент, экс-чемпион, штаб-квартира, унтер-офицер, контр-адмирал; но контратака.","Контратака, контрудар, контрнаступление пишутся слитно."],
h2:["Пол- и полу- со словами","Пол- (половина) пишется через дефис, если слово после него начинается с л, с гласной или с прописной буквы: пол-лимона, пол-яблока, пол-Европы. Перед остальными согласными пишется слитно: полгода, полметра. Полу- пишется слитно.","пол-лимона, пол-яблока, пол-Европы, пол-литра; полгода, полчаса, полуостров.","Если между пол и существительным есть определение, пишется раздельно (пол этого яблока)."],
h3:["Сложные слова с иноязычными частями","Через дефис пишутся слова с начальными частями мини-, макси-, пресс-, бизнес-, веб-, арт-, шеф-, рок-, онлайн-. Слитно пишутся слова с частями видео-, аудио-, фото-, авто-, а также сложносокращённые физ-, спец-, глав-, зав-. Проверка: найдите начальную часть и вспомните, к какой группе она относится.","мини-футбол, бизнес-план, пресс-конференция, рок-группа, интернет-магазин; видеоконференция, аудиокнига, физкультура, спецодежда.","Правила здесь опираются на словарь, проверяйте сомнительные слова."],
h4:["Слитно или через дефис в сложных прилагательных","Через дефис пишутся прилагательные, образованные сложением равноправных слов или обозначающие стороны света и сочетания национальностей (северо-запад, научно-технический, русско-немецкий, ярко-красный). Слитно пишутся прилагательные с подчинительной связью (древнерусский, жизнерадостный, дальневосточный). Проверка: можно ли между частями поставить союз и (научный и технический) — если можно, дефис.","северо-западный, научно-исследовательский, русско-немецкий; древнерусский, жизнерадостный, дальневосточный.","Сомнительные слова проверяйте по орфографическому словарю."],
st1:["Речевая избыточность","Плеоназм — повтор одного смысла разными словами (роль и значение, в итоге и в конечном итоге). Лишнее убирают. Проверка: уберите слово — если смысл не изменился, оно лишнее.","в итоге мы пришли; он сыграл роль; впервые познакомился.","Исключений нет."],
st2:["Канцеляризмы","Канцеляризмы — тяжёлые штампы деловой речи (осуществлять проведение, является актуальной, на данный момент). Их заменяют простым глаголом: осуществить проверку — проверить, нами принято решение — мы решили.","мы решили провести проверку; проблема актуальна; идёт подготовка документации.","В официальных документах допустимы устойчивые формулы, но не лишние слова."],
st3:["Разговорные слова в научном стиле","Научный и деловой стиль нейтральны. В них не допускаются просторечия, жаргон и неточные слова (куча, вроде как, задолбал, ребята). Их заменяют точными: куча измерений — серия измерений, ребята — сотрудники.","серия измерений, сотрудники лаборатории, длительный эксперимент.","Исключений нет."],
st4:["Степени сравнения у слов с абсолютным значением","Слова с абсолютным значением не имеют степеней сравнения и не сочетаются с очень, самый, более. Уникальный значит «единственный в своём роде», оптимальный — «наилучший». Говорят просто: уникальный, оптимальный.","данные уникальны; оптимальный вариант.","Исключений нет."]});

{k:"turgenev",n:"Иван Сергеевич Тургенев",q:["Берегите наш язык, наш прекрасный русский язык — это клад, это достояние, переданное нам нашими предшественниками! Обращайтесь почтительно с этим могущественным орудием; в руках умелых оно в состоянии совершать чудеса!","Во дни сомнений, во дни тягостных раздумий о судьбах моей родины, — ты один мне поддержка и опора, о великий, могучий, правдивый и свободный русский язык!"]},
{k:"gogol",n:"Николай Васильевич Гоголь",q:["Дивишься драгоценности нашего языка: что ни звук, то и подарок: всё зернисто, крупно, как сам жемчуг, и, право, иное названье ещё драгоценней самой вещи."]},
{k:"pushkin",n:"Александр Сергеевич Пушкин",q:["Как материал словесности, язык славяно-русский имеет неоспоримое превосходство перед всеми европейскими."]},
{k:"kuprin",n:"Александр Иванович Куприн",q:["Язык — это история народа. Язык — это путь цивилизации и культуры. Поэтому-то изучение и сбережение русского языка является не праздным занятием от нечего делать, но насущной необходимостью."]},
{k:"paustovsky",n:"Константин Георгиевич Паустовский",q:["С русским языком можно творить чудеса. Нет ничего такого в окружающей нас жизни и в нашем сознании, чего нельзя было бы передать русским словом.","Нам дан во владение самый богатый, меткий, могучий и поистине волшебный русский язык."]},
{k:"gorky",n:"Максим Горький",q:["Грамотность совершенно необходима для всех людей, а в особенности для тех, которые занимаются литературой."]},

function hub(st){document.documentElement.classList.add("snap");document.title="Учись вслух — тренажёр по русскому языку";app.innerHTML=`<div class="hz" id="hz"><section class="pg p1"><button class="hint" id="n1" aria-label="Дальше">Листай вправо<i></i></button></section><section class="pg p2"><div class="card sc"><div class="intro"><p>Русский язык — это не просто набор правил. Это инструмент мысли, точности и силы.</p><p>Великие писатели неслучайно говорили о нём почти с благоговением: Тургенев называл его кладом, Чехов требовал простоты и изящества, Паустовский уверял, что с ним можно творить чудеса. Грамотная письменная речь — это уважение к слову и к себе.</p><p>Этот тренажёр создан для тех, кто хочет не просто «знать правила», а уверенно владеть языком. Здесь нет случайных заданий. Каждый день — это система: орфография, пунктуация, стиль. Сначала школа, потом вузовский уровень. Сначала точность, потом свобода.</p><p class="vb"><span>Занимайся регулярно.</span><span>Ошибайся.</span><span>Разбирай.</span><span>Исправляй.</span></p><p>Через несколько недель ты заметишь: пишешь увереннее, чище и точнее.</p><p class="st">Начинаем.</p></div><button class="go big" id="n2">Приступаем</button></div></section><section class="pg p3"><div class="card sc"><h1 class="ttl"><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgICAgMCAgIDAwMDBAYEBAQEBAgGBgUGCQgKCgkICQkKDA8MCgsOCwkJDRENDg8QEBEQCgwSExIQEw8QEBD/2wBDAQMDAwQDBAgEBAgQCwkLEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBD/wAARCAHdAmwDASIAAhEBAxEB/8QAHQABAAICAwEBAAAAAAAAAAAAAAcIBQYDBAkBAv/EAE4QAAECBQMBBgMGAwYEBAQEBwECAwAEBQYRBxIhMQgTIkFRYRQycRUjQlKBkTNioQkWJENysReCwdElNJLwGFNj4URzotLxJjVUhJPC/8QAGwEBAAMBAQEBAAAAAAAAAAAAAAQFBgMCBwH/xAA1EQACAgIBAwMDAgUDBAMBAAAAAQIDBAUREiExEyJBBjJRFHEjYYGhsUJSkRUkwfAzcuHx/9oADAMBAAIRAxEAPwD1ThCEAIQhACEIQAhCEAIQhACEIQAhCEAIQj8qcQgEqVjHWPxtRXLB+o+ZHrGtXBeFu0dalT9ztSgQjlCVNkn3AOVZ+kaq/qRbrOEyk/cM+McKZaXg/uBFbftsbHfeX90Sa8W2zwiT8x9iI5a/bUlV/ELk7okin5nVsuKSlJ6 $("#gt").onclick=()=>location.hash="#t";$("#gq").onclick=()=>{cur=0;location.hash="#q"};
const hz=$("#hz"),dd=[...document.querySelectorAll("#hzd i")],cnt=3;let busy=0;
const at=()=>Math.max(0,Math.min(cnt-1,Math.round(hz.scrollLeft/hz.clientWidth)));
const to=n=>{n=Math.max(0,Math.min(cnt-1,n));hz.scrollTo({left:n*hz.clientWidth,behavior:"smooth"})};
if(st){hz.scrollLeft=st*hz.clientWidth;dd.forEach((x,j)=>x.className=j===st?"on":"")}
hz.addEventListener("scroll",()=>{const k=at();dd.forEach((x,j)=>x.className=j===k?"on":"")},{passive:true});
$("#n1").onclick=()=>to(1);$("#n2").onclick=()=>to(2);dd.forEach((x,j)=>x.onclick=()=>to(j));
hz.addEventListener("wheel",e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;const sl=hz.children[at()],d=e.deltaY;if(sl.scrollHeight>sl.clientHeight+2&&((d>0&&sl.scrollTop+sl.clientHeight<sl.scrollHeight-2)||(d<0&&sl.scrollTop>0)))return;e.preventDefault();if(busy||Math.abs(d)<4)return;busy=1;to(at()+(d>0?1:-1));setTimeout(()=>busy=0,650)},{passive:false});
window.hubKey=e=>{if(!document.getElementById("hz"))return;if(e.key==="ArrowRight")to(at()+1);if(e.key==="ArrowLeft")to(at()-1)};
scrollTo(0,0)}
function quotes(){document.title="Цитаты о русском языке";const N=S.length;cur=Math.max(0,Math.min(N-1,cur));const s=S[cur],w=s.n.split(" ");

let tx=0;app.ontouchstart=e=>{tx=e.touches[0].clientX};app.ontouchend=e=>{if(onQ()){const d=e.changedTouches[0].clientX-tx;if(d<-60)go(1);if(d>60)go(-1)}};
document.onkeydown=e=>{if(window.hubKey)hubKey(e);if(onQ()){if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)}};
function home(){document.title="Учись вслух — тренажёр по русскому языку";app.innerHTML=`<div class="hero"></div><section class="card"><button class="back" id="ib">← На главную</button><h1>Тренажёр по русскому языку</h1><p class="sub">Семь дней практики. Выберите уровень.</p>${L.map((v,i)=>`<button class="lv" data-l="${i}"><b>${v.n}</b><span>${i?"Повышенная сложность":"Школьная программа"}</span></button>`).join("")}</section>`;
app.querySelectorAll(".lv").forEach(b=>b.onclick=()=>location.hash="#"+b.dataset.l);$("#ib").onclick=()=>location.hash="#m";scrollTo(0,0)}
function days(l){app.innerHTML=`<section class="card"><button class="back" id="bk">← К уровням</button><h2>${L[l].n}</h2><p class="sub">Выберите день и вставляйте нужные буквы.</p><div class="grid">${L[l].d.map((d,k)=>{const r=P[l+"-"+k];return`<button class="tile ${r?"done":""}" data-d="${k}" ${d.q?"":"disabled"}><span class="n">День ${k+1}</span><span class="t">${d.t}</span><span class="s">${!d.q?"скоро":r?"✓ "+r[0]+" из "+r[1]:Math.min(30,d.q.length)+" заданий"}</span></button>`}).join("")}</div></section>`;
$("#bk").onclick=()=>location.hash="#t";app.querySelectorAll(".tile:not(:disabled)").forEach(b=>b.onclick=()=>location.hash="#"+l+"-"+b.dataset.d);scrollTo(0,0)}
const $=s=>document.querySelector(s);
function quiz(l,d){const D0=L[l].d[d];let Q=D0.q.slice();if(D0.keep){const r=sh(Q.slice(D0.keep));Q=sh(Q.slice(0,D0.keep).concat(r.slice(0,30-D0.keep)))}else Q=sh(Q).slice(0,30);const N=Q.length;let i=0,ok=0,miss=0;
function end(){const k=l+"-"+d,b=Math.max(ok,(P[k]||[0])[0]);P[k]=[b,N];try{localStorage.setItem("uv",JSON.stringify(P))}catch(e){}
app.innerHTML=`<section class="card res"><h2>День ${d+1} пройден</h2><p class="big">${ok} из ${N}</p><p class="sub">с первой попытки. ${ok/N>=.9?"Отличный результат!":ok/N>=.7?"Хорошо. Ещё немного практики.":"Перечитайте правила и попробуйте снова."}</p><button class="go" id="ag">Пройти ещё раз</button><button class="ghost" id="dy">К дням</button></section>`;
$("#ag").onclick=()=>quiz(l,d);$("#dy").onclick=()=>location.hash="#"+l;scrollTo(0,0)}
function step(){if(i>=N)return end();const it=Q[i],g=it.length===4;miss=0;if(it.length===2)return comma(it);let right,rule,opts,w;
if(g){right=it[2];rule=it[3];opts=it[1].split("|");const[a,b]=it[0].split("_");w=`${a}<span class="gap" id="gp">&nbsp;</span>${b}`}
else{right=it[1][0];rule=it[2];opts=sh(it[1].slice());w=it[0].replace("§",'<span class="gap w" id="gp">&nbsp;</span>')}
app.innerHTML=`<section class="card"><button class="back" id="bk">← К дням</button><div class="bar"><i style="width:${i/N*100}%"></i></div><p class="cnt">Задание ${i+1} из ${N}</p><p class="q">${g?"Какая буква пропущена?":"Выберите верное написание"}</p><div class="word${it[0].length>34?" long":""}">${w}</div><div class="opts">${opts.map(o=>`<button class="opt ${o.length>30?"long":o.length>2?"wide":""}" data-o="${o}">${o}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div></section>`;
$("#bk").onclick=()=>location.hash="#"+l;
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const v=b.dataset.o,gp=$("#gp")||{},fb=$("#fb");gp.textContent=v;
if(v===right){if(!miss)ok++;gp.className="gap good"+(g?"":" w");app.querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add("good");fb.className="fb ok";
fb.innerHTML=`<b>Верно.</b>${rl(rule)}<button class="go" id="nx">${i<N-1?"Дальше →":"Завершить"}</button>`;$("#nx").onclick=()=>{i++;step()};$("#nx").focus()}
else{miss++;b.disabled=true;b.classList.add("bad");gp.className="gap bad"+(g?"":" w");fb.className="fb no";fb.innerHTML=`<b>Не совсем.</b> Прочитайте правило и выберите другой вариант.${rl(rule)}`}});scrollTo(0,0)}
function comma(it){const W=it[0].split(" "),ex=new Set(),on=new Set();W.forEach((x,j)=>{if(x.endsWith(",")){ex.add(j);W[j]=x.slice(0,-1)}});
app.innerHTML=`<section class="card"><button class="back" id="bk">← К дням</button><div class="bar"><i style="width:${i/N*100}%"></i></div><p class="cnt">Задание ${i+1} из ${N}</p><p class="q">Нажмите между словами, где нужна запятая. Повторное нажатие убирает её.</p><div class="word cm">${W.map((x,j)=>x+(j<W.length-1?`<button class="sl" data-j="${j}" aria-label="Запятая после слова ${x}"></button>`:"")+" ").join("")}</div><button class="go" id="ck">Проверить</button><div class="fb" id="fb" aria-live="polite"></div></section>`;
$("#bk").onclick=()=>location.hash="#"+l;const S=[...app.querySelectorAll(".sl")];
S.forEach(b=>b.onclick=()=>{const j=+b.dataset.j;on.has(j)?on.delete(j):on.add(j);b.textContent=on.has(j)?",":"";b.className="sl"});
$("#ck").onclick=()=>{const fb=$("#fb");S.forEach(b=>{const j=+b.dataset.j,e=ex.has(j),o=on.has(j);b.className="sl"+(o&&e?" good":o?" bad":e?" miss":"");if(e&&!o)b.textContent=","});
if([...ex].every(j=>on.has(j))&&on.size===ex.size){if(!miss)ok++;S.forEach(b=>b.disabled=true);$("#ck").hidden=true;fb.className="fb ok";fb.innerHTML=`<b>Верно.</b>${rl(it[1])}<button class="go" id="nx">${i<N-1?"Дальше →":"Завершить"}</button>`;$("#nx").onclick=()=>{i++;step()};$("#nx").focus()}
else{miss++;fb.className="fb no";fb.innerHTML=`<b>Не совсем.</b> Зелёные запятые верны, красные лишние, пунктиром отмечены пропущенные. Исправьте и нажмите «Проверить» ещё раз.${rl(it[1])}`}}}
step()}
function route(){document.documentElement.classList.remove("snap");const m=location.hash.match(/^#(\d)(?:-(\d))?$/);if(m&&L[+m[1]]){const l=+m[1];if(m[2]!==undefined&&L[l].d[+m[2]]&&L[l].d[+m[2]].q)quiz(l,+m[2]);else days(l)}else if(location.hash==="#t")home();else if(onQ())quotes();else hub(location.hash==="#m"?2:0)}
window.onhashchange=route;route();
</script></body></html>
